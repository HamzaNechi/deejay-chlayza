<!doctype html>
<html class="no-js" lang="en">
<head>
        <meta charset="utf-8" />
        <title>Deejay Chlayza | Musique et DJ</title>
        <meta name="google" value="notranslate" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

        <meta name="description" content="Découvrez Deejay Chlayza, son univers musical et ses morceaux. Écoutez la playlist et partagez la musique." />
        <meta name="keywords" content="Deejay Chlayza, DJ Chlayza, musique, mix DJ, DJ set, playlist musicale" />

        <meta name="author" content="Deejay Chlayza" />
        <meta name="application-name" content="Deejay Chlayza" />
              
        <meta property="og:title" content="Deejay Chlayza | Musique et DJ" />
        <meta property="og:type" content="website" />
        <meta property="og:image" content="assets/img/img-logo.png" />
        <meta property="og:description" content="Découvrez Deejay Chlayza, son univers musical et ses morceaux. Écoutez la playlist et partagez la musique." />

        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Deejay Chlayza | Musique et DJ">
        <meta name="twitter:description" content="Découvrez Deejay Chlayza, son univers musical et ses morceaux. Écoutez la playlist et partagez la musique.">
        <meta name="twitter:image" content="assets/img/img-logo.png">

        <link rel="icon" href="assets/img/favicon.ico" />

        <link href="assets/css/style.css" rel="stylesheet" media="screen" />

        <script src="assets/js/lib/modernizr.custom.js"></script>
        <script src="assets/js/lib/detectizr.min.js"></script>
    </head>
    <body>
        <div class="scene">
            <img class="logo" src="assets/img/img-logo.png">
            <nav>
                <div class="prompt mute-prompt">
                    <div class="button icons">&#xe002;</div>
                    <span class="label">Sound | on</span>
                </div>
                <div class="prompt share-prompt">
                    <button class="button nav-track-previous" type="button" aria-label="Previous track" disabled>Prev</button>
                    <span class="label">Previous track</span>
                </div>
                <div class="prompt adopt-prompt">
                    <button class="button nav-track-next" type="button" aria-label="Next track" disabled>Next</button>
                    <span class="label">Next track</span>
                </div>
            </nav>
            <section class="playlist" aria-label="Music playlist">
                <button class="playlist-toggle" type="button" aria-expanded="false" aria-controls="playlist-panel">
                    Music playlist
                </button>
                <div class="playlist-panel" id="playlist-panel" hidden>
                    <div class="playlist-now">
                        <span class="playlist-now-title">Track 1</span>
                    </div>

                    <ul class="playlist-list" id="playlist-list" role="listbox" aria-label="Tracks"></ul>

                    <!-- conservé pour playlist.js, masqué visuellement -->
                    <label for="playlist-tracks" class="sr-only">Choose a track</label>
                    <select id="playlist-tracks" class="sr-only" disabled></select>

                    <div class="playlist-controls">
                        <button class="playlist-previous" type="button" aria-label="Previous track" disabled>&laquo;</button>
                        <button class="playlist-play" type="button" aria-label="Play" disabled>Play</button>
                        <button class="playlist-next" type="button" aria-label="Next track" disabled>&raquo;</button>
                    </div>

                    <div class="playlist-volume">
                        <span class="icons playlist-volume-icon" aria-hidden="true">&#xe002;</span>
                        <input class="playlist-volume-range" type="range" min="0" max="100" value="100" aria-label="Volume">
                        <output class="playlist-volume-value">100</output>
                    </div>

                    <p class="playlist-status" aria-live="polite">Loading playlist...</p>
                </div>
            </section>
        </div>
        <div class="loading">
            <div class="mask">
                <img class="intro-logo" src="assets/img/img-logo.png">
                <img class="egg" src="assets/img/chlayza.png">
                <img class="egg-shadow" src="assets/img/img-egg_shadow.png">
            </div>
            <div class="load-mobile-prompt">Touch to start!</div>
            <div class="load-progress">Turn up your sound...<div class="red">Turn up your sound...</div></div>
            <img class="loader" src="assets/img/img-loader.png">
        </div>
        <div class="scripts">
            <script src="assets/js/playlist.js"></script>
            <script>
            (function () {
                var select = document.getElementById('playlist-tracks');
                var list   = document.getElementById('playlist-list');
                var title  = document.querySelector('.playlist-now-title');
                var range  = document.querySelector('.playlist-volume-range');
                var value  = document.querySelector('.playlist-volume-value');

                function choose(i) {
                    select.selectedIndex = i;
                    select.dispatchEvent(new Event('change', { bubbles: true }));
                    sync();
                }

                function render() {
                    list.innerHTML = '';
                    Array.prototype.forEach.call(select.options, function (opt, i) {
                        var li = document.createElement('li');
                        li.setAttribute('role', 'option');
                        li.tabIndex = 0;
                        li.textContent = opt.textContent;
                        li.addEventListener('click', function () { choose(i); });
                        li.addEventListener('keydown', function (e) {
                            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(i); }
                        });
                        list.appendChild(li);
                    });
                    sync();
                }

                function sync() {
                    var current = select.selectedIndex;
                    Array.prototype.forEach.call(list.children, function (li, i) {
                        var on = i === current;
                        li.classList.toggle('active', on);
                        li.setAttribute('aria-selected', on);
                    });
                    if (current >= 0 && select.options[current]) {
                        title.textContent = select.options[current].textContent;
                    }
                }

                range.addEventListener('input', function () {
                    value.textContent = range.value;
                    range.style.setProperty('--fill', range.value + '%');
                    document.dispatchEvent(new CustomEvent('playlist:volume', { detail: { volume: +range.value } }));
                });

                new MutationObserver(render).observe(select, { childList: true });
                select.addEventListener('change', sync);
                setInterval(sync, 500); // si playlist.js change de piste sans événement
                render();
            })();
            </script>
            <script data-main="assets/js/app.mineef3.js?v=0.3" src="assets/js/lib/require.js"></script>
            </div>
    </body>

</html>
